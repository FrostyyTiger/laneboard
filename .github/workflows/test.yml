name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # node-pty compiles against the Node headers; build-essential and python3
      # are on the ubuntu-latest image already, so `npm ci` is all it takes.
      - run: npm ci
      - run: npm test
